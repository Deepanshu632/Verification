<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in · Kindred</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="topbar"><a class="brand" href="/">kindred<span>.</span></a></header><main class="shell" style="max-width:520px"><div class="hero"><div class="eyebrow">Admin access</div><h1>Sign in to review applications.</h1></div><section class="card">{% if configured %}<form action="/admin/login" method="post"><div class="field"><label for="token">Admin token</label><input id="token" name="token" type="password" required autocomplete="current-password">{% if error %}<div class="help" style="color:#a44434">That token did not match. Try again.</div>{% endif %}</div><button class="button" style="margin-top:18px">Continue →</button></form>{% else %}<div class="notice">Admin access is disabled. Set the ADMIN_TOKEN environment variable and restart the app.</div>{% endif %}</section></main></body></html>
